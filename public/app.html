<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RenaIA — Tu espacio de reinvención</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;1,500&display=swap');
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden}
    :root{
      --green:#1a9e72;--green-dim:#0f7a55;--green-glow:rgba(26,158,114,.12);
      --border:rgba(26,158,114,.14);--border-faint:rgba(255,255,255,.055);
      --surface:rgba(8,16,11,.92);--bg:#050807;
      --text-1:#e4eeea;--text-2:#6a8878;--text-3:#2a3d34;
    }
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text-1);display:grid;grid-template-columns:248px 1fr 300px;grid-template-rows:100vh}
    .fade-in{animation:fadeIn .5s ease forwards}
    .fade-in-up{animation:fadeInUp .6s ease forwards;opacity:0}
    .fade-in-up.d1{animation-delay:.1s}.fade-in-up.d2{animation-delay:.2s}.fade-in-up.d3{animation-delay:.3s}.fade-in-up.d4{animation-delay:.4s}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes starfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

    /* SIDEBAR */
    .sidebar{background:rgba(4,9,6,.98);border-right:.5px solid var(--border-faint);display:flex;flex-direction:column;padding:1.5rem 1rem;overflow-y:auto}
    .sidebar::-webkit-scrollbar{width:0}
    .sb-logo{display:flex;align-items:center;gap:9px;text-decoration:none;margin-bottom:1.75rem;padding:0 .25rem}
    .sb-logo-text{font-size:17px;font-weight:500;color:var(--text-1);letter-spacing:-.3px}
    .sb-logo-text em{color:var(--green);font-style:normal}
    .sb-logo-sub{font-size:11px;color:var(--text-3);font-weight:300;margin-top:1px}
    .sb-new-btn{display:flex;align-items:center;gap:8px;background:var(--green-dim);color:white;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .3s;margin-bottom:1.5rem;box-shadow:0 4px 20px rgba(15,122,85,.25);width:100%}
    .sb-new-btn:hover{background:var(--green);transform:translateY(-1px)}
    .sb-nav{display:flex;flex-direction:column;gap:2px;flex:1}
    .sb-section-label{font-size:9px;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;color:var(--text-3);padding:1rem .75rem .4rem;opacity:.8}
    .sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13px;color:var(--text-2);font-weight:300;transition:all .25s;text-decoration:none;border:.5px solid transparent}
    .sb-item:hover{background:rgba(26,158,114,.06);color:#a0c8b4}
    .sb-item.active{background:rgba(26,158,114,.1);border-color:var(--border);color:var(--text-1)}
    .sb-item.locked{opacity:.35;cursor:not-allowed;pointer-events:none}
    .sb-item-icon{font-size:15px;flex-shrink:0;width:18px;text-align:center}
    .sb-lock{font-size:10px;margin-left:auto;color:var(--text-3)}
    .sb-user{margin-top:auto;padding-top:1rem;border-top:.5px solid var(--border-faint)}
    .sb-user-row{display:flex;align-items:center;gap:10px;padding:.75rem .5rem;border-radius:10px;cursor:pointer;transition:all .25s}
    .sb-user-row:hover{background:rgba(255,255,255,.03)}
    .sb-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#082818,var(--green));display:flex;align-items:center;justify-content:center;font-size:13px;color:white;font-weight:600;flex-shrink:0}
    .sb-user-name{font-size:13px;font-weight:500;color:var(--text-1)}
    .sb-user-plan{font-size:10px;color:var(--text-3);font-weight:300;margin-top:1px}
    .sb-user-plan.pro{color:var(--green)}
    .sb-progress-wrap{padding:.25rem .5rem .75rem}
    .sb-progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-bottom:.4rem}
    .sb-progress-bar{height:3px;background:rgba(255,255,255,.06);border-radius:100px;overflow:hidden}
    .sb-progress-fill{height:100%;background:linear-gradient(90deg,var(--green-dim),var(--green));border-radius:100px;transition:width 1.2s ease}
    .sb-progress-note{font-size:10px;color:var(--text-3);margin-top:.4rem}
    .sb-settings{display:flex;gap:.5rem;padding:.25rem .5rem 0}
    .sb-settings-btn{width:30px;height:30px;border-radius:8px;background:transparent;border:.5px solid var(--border-faint);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-3);cursor:pointer;transition:all .25s}
    .sb-settings-btn:hover{border-color:var(--border);color:var(--text-2)}

    /* MAIN */
    .main{display:flex;flex-direction:column;overflow:hidden;position:relative}
    .topbar{padding:1.25rem 1.75rem;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:.5px solid var(--border-faint);flex-shrink:0;background:rgba(5,9,7,.96);backdrop-filter:blur(10px)}
    .topbar-title{font-family:'Playfair Display',serif;font-size:30px;font-weight:500;color:var(--text-1);letter-spacing:-.5px}
    .topbar-sub{font-size:13px;color:var(--text-2);font-weight:300;margin-top:.25rem;line-height:1.5;max-width:480px}
    .agent-selector{display:flex;align-items:center;gap:8px;background:rgba(8,16,11,.9);border:.5px solid var(--border);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:13px;color:var(--text-1);transition:all .3s;flex-shrink:0}
    .agent-selector:hover{border-color:rgba(26,158,114,.35)}
    .agent-selector-icon{color:var(--green);font-size:14px}
    .hero-banner{height:110px;flex-shrink:0;position:relative;overflow:hidden;background:linear-gradient(135deg,#030d06,#071a0e,#040c07)}
    .hero-banner-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 60% 50%,rgba(26,158,114,.14),transparent 65%)}
    .hero-banner-grid{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(26,158,114,.25) 1px,transparent 1px);background-size:38px 38px;opacity:.12}

    /* FEED */
    .feed{flex:1;overflow-y:auto;padding:1.5rem 1.75rem;display:flex;flex-direction:column;gap:1.25rem}
    .feed::-webkit-scrollbar{width:0}

    /* CARDS */
    .card{background:rgba(7,14,10,.88);border:.5px solid var(--border-faint);border-radius:16px;padding:1.5rem;transition:all .3s}
    .card:hover{border-color:var(--border)}
    .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
    .card-title{font-size:14px;font-weight:500;color:var(--text-1)}
    .card-sub{font-size:12px;color:var(--text-2);font-weight:300;margin-top:2px}
    .card-link{font-size:12px;color:var(--green);text-decoration:none;opacity:.8;transition:opacity .2s}
    .card-link:hover{opacity:1}

    /* EMPTY STATE */
    .empty-hero{text-align:center;padding:3rem 2rem 2rem;display:flex;flex-direction:column;align-items:center}
    .empty-star{font-size:32px;color:var(--green);margin-bottom:1.75rem;display:block;animation:starfloat 3s ease-in-out infinite;text-shadow:0 0 28px rgba(26,158,114,.4)}
    .empty-title{font-family:'Playfair Display',serif;font-size:36px;font-weight:500;line-height:1.1;letter-spacing:-.8px;color:var(--text-1);margin-bottom:.75rem}
    .empty-title em{font-style:italic;color:var(--green);display:block}
    .empty-sub{font-size:14px;color:var(--text-2);font-weight:300;line-height:1.8;max-width:420px;margin-bottom:2.5rem}
    .empty-cta{display:inline-flex;align-items:center;gap:10px;background:var(--green-dim);color:white;padding:15px 32px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .3s;box-shadow:0 8px 32px rgba(15,122,85,.28);text-decoration:none}
    .empty-cta:hover{background:var(--green);transform:translateY(-2px)}
    .placeholder-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
    .placeholder-card{background:rgba(5,12,8,.7);border:.5px solid rgba(255,255,255,.04);border-radius:14px;padding:1.5rem;text-align:center;position:relative;overflow:hidden}
    .placeholder-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(26,158,114,.04),transparent 60%)}
    .placeholder-icon{font-size:22px;margin-bottom:.75rem;display:block;opacity:.4}
    .placeholder-text{font-size:12px;color:var(--text-3);font-weight:300;line-height:1.6}

    /* FREE STATE */
    .conv-preview{background:rgba(4,10,7,.8);border:.5px solid var(--border-faint);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem}
    .conv-preview-icon{color:var(--green);font-size:14px;margin-bottom:.5rem;display:block}
    .conv-preview-text{font-size:13px;color:var(--text-2);font-weight:300;line-height:1.65}
    .conv-preview-msg{margin-top:.75rem;padding:.75rem 1rem;background:rgba(26,158,114,.06);border:.5px solid rgba(26,158,114,.12);border-radius:8px;font-size:13px;color:#7aaa8e;font-weight:300;line-height:1.6;font-style:italic}
    .conv-preview-time{font-size:11px;color:var(--text-3);margin-top:.5rem}
    .conv-btn{display:flex;align-items:center;justify-content:space-between;background:var(--green-dim);color:white;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .3s;box-shadow:0 4px 20px rgba(15,122,85,.22);width:100%}
    .conv-btn:hover{background:var(--green);transform:translateY(-1px)}

    /* HISTORIAL */
    .hist-list{display:flex;flex-direction:column;gap:.6rem}
    .hist-item{display:flex;align-items:center;gap:12px;padding:.85rem 1rem;background:rgba(4,10,7,.7);border:.5px solid var(--border-faint);border-radius:10px;cursor:pointer;transition:all .25s}
    .hist-item:hover{border-color:var(--border);background:rgba(6,14,10,.85)}
    .hist-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;opacity:.6}
    .hist-msg{font-size:13px;color:var(--text-2);font-weight:300;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .hist-time{font-size:11px;color:var(--text-3);flex-shrink:0}

    /* SUGGESTIONS */
    .suggestions-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem}
    .suggestion{background:rgba(4,10,7,.8);border:.5px solid var(--border-faint);border-radius:12px;padding:1rem;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
    .suggestion:hover{border-color:var(--border);transform:translateY(-2px)}
    .suggestion-icon{font-size:16px;margin-bottom:.6rem;display:block}
    .suggestion-text{font-size:12px;color:var(--text-2);font-weight:300;line-height:1.6;margin-bottom:.4rem}
    .suggestion-tag{font-size:10px;color:var(--text-3)}

    /* LOCKED */
    .locked-module{background:rgba(4,9,6,.7);border:.5px solid rgba(255,255,255,.04);border-radius:14px;padding:1.25rem 1.5rem;display:flex;align-items:center;gap:14px;opacity:.6}
    .locked-icon{font-size:18px;color:var(--text-3);flex-shrink:0}
    .locked-text{font-size:13px;color:var(--text-3);font-weight:300}
    .locked-badge{margin-left:auto;font-size:10px;color:var(--text-3);background:rgba(255,255,255,.04);border:.5px solid rgba(255,255,255,.06);border-radius:100px;padding:3px 10px;white-space:nowrap;flex-shrink:0}

    /* MEMORY */
    .memory-grid{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:start}
    .memory-list{display:flex;flex-direction:column;gap:.6rem}
    .memory-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text-2);font-weight:300;line-height:1.5}
    .memory-check{color:var(--green);font-size:12px;flex-shrink:0;margin-top:2px}
    .memory-ai-card{background:rgba(26,158,114,.07);border:.5px solid var(--border);border-radius:12px;padding:1rem;max-width:190px;text-align:center}
    .memory-ai-icon{font-size:20px;margin-bottom:.5rem;display:block}
    .memory-ai-text{font-size:12px;color:#5a8870;font-weight:300;line-height:1.6}
    .memory-ai-text em{color:var(--green);font-style:normal}

    /* CHAT INPUT */
    .chat-input-wrap{padding:1rem 1.75rem;border-top:.5px solid var(--border-faint);flex-shrink:0;background:rgba(4,9,6,.96)}
    .chat-input-inner{display:flex;align-items:center;gap:10px;background:rgba(6,14,10,.9);border:.5px solid var(--border-faint);border-radius:100px;padding:12px 14px 12px 22px;transition:border-color .3s}
    .chat-input-inner:focus-within{border-color:rgba(26,158,114,.35)}
    .chat-input-inner input{flex:1;background:transparent;border:none;outline:none;color:var(--text-1);font-size:14px;font-family:'DM Sans',sans-serif;font-weight:300}
    .chat-input-inner input::placeholder{color:var(--text-3)}
    .chat-send-btn{width:38px;height:38px;border-radius:50%;background:var(--green);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .2s}
    .chat-send-btn:hover{transform:scale(1.05)}
    .chat-send-btn svg{width:15px;height:15px;fill:white}

    /* RIGHT PANEL */
    .right-panel{background:rgba(4,9,6,.98);border-left:.5px solid var(--border-faint);display:flex;flex-direction:column;overflow-y:auto;padding:1.5rem 1.25rem;gap:1.75rem}
    .right-panel::-webkit-scrollbar{width:0}
    .rp-title{font-size:13px;font-weight:500;color:var(--text-1);margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between}
    .rp-title a{font-size:11px;color:var(--green);text-decoration:none;opacity:.7;font-weight:300}
    .donut-wrap{display:flex;align-items:center;gap:1.25rem;margin-bottom:.75rem}
    .donut-chart{position:relative;flex-shrink:0;width:88px;height:88px}
    .donut-chart svg{transform:rotate(-90deg)}
    .donut-bg{fill:none;stroke:rgba(255,255,255,.05);stroke-width:8}
    .donut-fill{fill:none;stroke-width:8;stroke-linecap:round;stroke-dasharray:220;transition:stroke-dashoffset 1.2s ease}
    .donut-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .donut-pct{font-family:'Playfair Display',serif;font-size:20px;font-weight:500;color:var(--text-1)}
    .donut-label{font-size:9px;color:var(--text-3);letter-spacing:.5px}
    .donut-legend{display:flex;flex-direction:column;gap:.5rem;flex:1}
    .donut-leg-item{display:flex;align-items:center;justify-content:space-between}
    .donut-leg-left{display:flex;align-items:center;gap:6px}
    .donut-leg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .donut-leg-name{font-size:12px;color:var(--text-2);font-weight:300}
    .donut-leg-val{font-size:12px;color:var(--text-1);font-weight:400}
    .rp-placeholder{background:rgba(5,12,8,.7);border:.5px solid rgba(255,255,255,.04);border-radius:12px;padding:1.25rem;text-align:center}
    .rp-placeholder-icon{font-size:20px;margin-bottom:.6rem;display:block;opacity:.3}
    .rp-placeholder-text{font-size:12px;color:var(--text-3);font-weight:300;line-height:1.6}
    .reflection-card{background:rgba(6,14,10,.7);border:.5px solid var(--border-faint);border-radius:12px;padding:1rem}
    .reflection-text{font-size:13px;color:var(--text-2);font-weight:300;line-height:1.7;font-style:italic}
    .reflection-time{font-size:11px;color:var(--text-3);margin-top:.6rem}
    .upgrade-banner{background:linear-gradient(135deg,rgba(8,20,14,.9),rgba(5,14,9,.95));border:.5px solid var(--border);border-radius:14px;padding:1.25rem;position:relative;overflow:hidden}
    .upgrade-banner::before{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;background:radial-gradient(ellipse,rgba(26,158,114,.15),transparent 65%)}
    .upgrade-banner-title{font-size:13px;font-weight:500;color:var(--text-1);margin-bottom:.4rem}
    .upgrade-banner-sub{font-size:12px;color:var(--text-2);font-weight:300;line-height:1.6;margin-bottom:1rem}
    .upgrade-btn{display:flex;align-items:center;justify-content:space-between;background:var(--green-dim);color:white;padding:9px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .3s;width:100%;box-shadow:0 4px 16px rgba(15,122,85,.25)}
    .upgrade-btn:hover{background:var(--green)}

    /* CHAT VIEW */
    #chat-view{display:none;flex-direction:column;flex:1;overflow:hidden}
    #chat-view.active{display:flex}
    #home-view{display:flex;flex-direction:column;flex:1;overflow:hidden}
    #home-view.hidden{display:none}
    .chat-messages{flex:1;overflow-y:auto;padding:1.5rem 1.75rem;display:flex;flex-direction:column;gap:1.25rem}
    .chat-messages::-webkit-scrollbar{width:0}
    .msg{display:flex;gap:10px;align-items:flex-start;animation:fadeIn .4s ease}
    .msg.user{flex-direction:row-reverse}
    .msg-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500}
    .msg-avatar.ai{background:linear-gradient(135deg,#0a4a38,var(--green));color:white;font-size:12px}
    .msg-avatar.user{background:#0f1623;color:#374151;border:.5px solid #1a2235;font-size:10px}
    .bubble{max-width:78%;padding:11px 15px;border-radius:14px;font-size:14px;line-height:1.7;font-weight:300}
    .msg.ai .bubble{background:#0a1a12;border:.5px solid rgba(26,158,114,.12);border-bottom-left-radius:4px;color:#e0e0e0}
    .msg.user .bubble{background:var(--green);color:white;border-bottom-right-radius:4px}
    .typing-wrap{display:flex;gap:10px;align-items:flex-start}
    .typing{display:flex;gap:4px;padding:11px 15px;background:#0a1a12;border:.5px solid rgba(26,158,114,.12);border-radius:14px;border-bottom-left-radius:4px}
    .typing span{width:5px;height:5px;border-radius:50%;background:var(--green);animation:bounce 1.2s infinite}
    .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  </style>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QFV6SRFDKL"></script>

  </script>
</head>
<body>

  <aside class="sidebar">
    <a class="sb-logo" href="index.html">
      <svg width="22" height="22" viewBox="0 0 30 30" fill="none">
        <path d="M7 5L7 25" stroke="#1a9e72" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M7 5L18 5C22 5 24 7.5 24 11C24 14.5 22 17 18 17L7 17" stroke="#1a9e72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 17L24 25" stroke="#1a9e72" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="sb-logo-text">Rena<em>IA</em></div>
        <div class="sb-logo-sub">Tu sistema de reinvención.</div>
      </div>
    </a>
    <button class="sb-new-btn" onclick="nuevaConversacion()"><span>＋</span> Nueva conversación</button>
    <nav class="sb-nav">
      <div class="sb-section-label">Principal</div>
      <a class="sb-item active" id="nav-inicio" onclick="showHome(event)"><span class="sb-item-icon">⌂</span> Inicio</a>
      <a class="sb-item" id="nav-conv" onclick="showConversaciones(event)"><span class="sb-item-icon">💬</span> Conversaciones</a>
      <a class="sb-item" id="nav-refl" onclick="showReflexiones(event)"><span class="sb-item-icon">📖</span> Reflexiones</a>
      <div class="sb-section-label">Mi proceso</div>
      <a class="sb-item" id="nav-prog" onclick="navClick(event,this)"><span class="sb-item-icon">↗</span> Mi progreso</a>
      <a class="sb-item locked" id="nav-road"><span class="sb-item-icon">◎</span> Roadmap<span class="sb-lock">🔒</span></a>
      <a class="sb-item locked" id="nav-cal"><span class="sb-item-icon">📅</span> Calendario<span class="sb-lock">🔒</span></a>
      <div class="sb-section-label">Herramientas</div>
      <a class="sb-item" onclick="navClick(event,this)"><span class="sb-item-icon">◈</span> Recursos</a>
      <a class="sb-item" onclick="navClick(event,this)"><span class="sb-item-icon">✦</span> Memoria</a>
    </nav>
    <div class="sb-user">
      <div class="sb-user-row">
        <div class="sb-avatar" id="sb-avatar">F</div>
        <div>
          <div class="sb-user-name" id="sb-name">—</div>
          <div class="sb-user-plan" id="sb-plan">Plan Gratis</div>
        </div>
      </div>
      <div class="sb-progress-wrap" id="sb-progress-wrap" style="display:none">

  <script>
    const SUPABASE_URL      = 'https://lmfgfpawtlrbneleodcn.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxtZmdmcGF3dGxyYm5lbGVvZGNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMjQzNzgsImV4cCI6MjA5NDkwMDM3OH0.IqZpjeL1c2nHG1zrB3WgbQyP6Ll_TDcGS0Iu6CRBM1c';
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let userState   = null;
    let userName    = '';
    let userData    = {};
    const agentLabels = { core:'✦ Rena Core', path:'◎ Rena Path', career:'↗ Rena Career' };

    // ── Limpiar markdown básico ──
    function cleanText(text) {
      if (!text) return '';
      return text
        .replace(/\*\*(.*?)\*\*/g, '$1')
        .replace(/\*(.*?)\*/g, '$1')
        .replace(/#{1,6}\s/g, '')
        .replace(/`(.*?)`/g, '$1')
        .trim();
    }

    // ── INIT ──
    async function init() {
      document.body.style.opacity = '0';
      document.body.style.transition = 'opacity .3s ease';
      const { data: { session } } = await sb.auth.getSession();
      if (!session?.user) { window.location.href = '/'; return; }
      currentUser = session.user;
      await loadUser();
      document.body.style.opacity = '1';
      await checkUserState();
      renderDashboard();
    }

    async function loadUser() {
      const { data } = await sb
        .from('usuarios')
        .select('nombre, onboarding_completed, is_pro')
        .eq('id', currentUser.id)
        .maybeSingle();
      userName = data?.nombre
        || currentUser.user_metadata?.full_name?.split(' ')[0]
        || currentUser.email?.split('@')[0]
        || 'tú';
      userData.isPro = data?.is_pro || false;
      document.getElementById('sb-name').textContent   = userName;
      document.getElementById('sb-avatar').textContent = userName[0].toUpperCase();
      document.getElementById('sb-plan').textContent   = userData.isPro ? '✦ Plan Pro' : 'Plan Gratis';
      if (userData.isPro) document.getElementById('sb-plan').classList.add('pro');
    }

    async function checkUserState() {
      const { count } = await sb
        .from('conversaciones')
        .select('id', { count:'exact', head:true })
        .eq('usuario_id', currentUser.id);

      userData.convCount = count || 0;
      userData.hasConversations = userData.convCount > 0;

      if (userData.hasConversations) {
        // Última conversación del usuario
        const { data: lastConvs } = await sb
          .from('conversaciones')
          .select('mensaje, created_at, rol')
          .eq('usuario_id', currentUser.id)
          .eq('rol', 'user')
          .order('created_at', { ascending:false })
          .limit(1);
        userData.lastConv = lastConvs?.[0] || null;

        // Últimas respuestas de RenaIA para reflexiones y sugerencias
        const { data: aiMsgs } = await sb
          .from('conversaciones')
          .select('mensaje, created_at')
          .eq('usuario_id', currentUser.id)
          .eq('rol', 'assistant')
          .order('created_at', { ascending:false })
          .limit(5);
        userData.recentAI = aiMsgs || [];

        // Historial de mensajes del usuario (para mostrar en conversaciones)
        const { data: userMsgs } = await sb
          .from('conversaciones')
          .select('mensaje, created_at')
          .eq('usuario_id', currentUser.id)
          .eq('rol', 'user')
          .order('created_at', { ascending:false })
          .limit(5);
        userData.recentUser = userMsgs || [];
      }

      const { data: mem } = await sb
        .from('memoria_usuario')
        .select('summary, emotional_state, goals')
        .eq('user_id', currentUser.id)
        .maybeSingle();
      userData.memory = mem || null;

      if (!userData.hasConversations) userState = 'empty';
      else if (userData.isPro)        userState = 'pro';
      else                            userState = 'free';
    }

    function renderDashboard() {
      if (userState === 'empty') renderEmptyState();
      if (userState === 'free')  renderFreeState();
      if (userState === 'pro')   renderProState();
      renderRightPanel();
    }

    // ── EMPTY STATE ──
    function renderEmptyState() {
      document.getElementById('topbar-title').innerHTML =
        `Hola, <em style="font-style:normal;color:var(--green)">${userName}</em>. 🌙`;
      document.getElementById('topbar-sub').textContent = 'Tu espacio personal de reinvención está listo.';
      document.getElementById('feed').innerHTML = `
        <div class="empty-hero fade-in-up">
          <span class="empty-star">✦</span>
          <h2 class="empty-title">Todavía no comenzamos<em>tu proceso de reinvención.</em></h2>
          <p class="empty-sub">Este es tu espacio. Aquí no hay formularios, ni pasos forzados.<br>Solo una conversación real cuando estés listo.</p>
          <a href="#" class="empty-cta" onclick="comenzarConversacion(event)"><span>✦</span> Comenzar primera conversación <span>→</span></a>
        </div>
        <div class="placeholder-grid fade-in-up d2">
          <div class="placeholder-card"><span class="placeholder-icon">💬</span><p class="placeholder-text">Tus conversaciones aparecerán aquí</p></div>
          <div class="placeholder-card"><span class="placeholder-icon">◎</span><p class="placeholder-text">Tu roadmap se construirá contigo</p></div>
          <div class="placeholder-card"><span class="placeholder-icon">🧠</span><p class="placeholder-text">RenaIA recordará tu progreso</p></div>
        </div>`;
      document.getElementById('nav-road').classList.add('locked');
      document.getElementById('nav-cal').classList.add('locked');
    }

    // ── FREE STATE ──
    function renderFreeState() {
      document.getElementById('topbar-title').innerHTML =
        `Hola, <em style="font-style:normal;color:var(--green)">${userName}</em>. 🌙`;
      document.getElementById('topbar-sub').textContent = 'Retoma donde lo dejaste. RenaIA recuerda lo que importa.';

      document.getElementById('sb-progress-wrap').style.display = 'block';
      const pct = Math.min(userData.convCount * 5, 40);
      document.getElementById('sb-pct').textContent = pct + '%';
      document.getElementById('sb-bar').style.width = pct + '%';
      document.getElementById('sb-progress-note').textContent = 'Sigue conversando para avanzar.';

      const lastMsg  = cleanText(userData.lastConv?.mensaje || '...');
      const lastTime = userData.lastConv
        ? formatDate(userData.lastConv.created_at)
        : '';

      // Historial reciente
      const histHTML = userData.recentUser?.length > 1 ? `
        <div class="card fade-in-up d2">
          <div class="card-header">
            <div><div class="card-title">Conversaciones recientes</div><div class="card-sub">Tu historial de reinvención</div></div>
          </div>
          <div class="hist-list">
            ${userData.recentUser.slice(0,4).map(m => `
              <div class="hist-item" onclick="retornarConversacion()">
                <div class="hist-dot"></div>
                <span class="hist-msg">${cleanText(m.mensaje)}</span>
                <span class="hist-time">${formatDate(m.created_at)}</span>
              </div>`).join('')}
          </div>
        </div>` : '';

      // Sugerencias dinámicas
      const suggestions = buildSuggestions();

      // Memoria ligera
      let memoryHTML = '';
      if (userData.memory?.summary) {
        const items = userData.memory.summary.split('\n').filter(Boolean).slice(0,4);
        memoryHTML = `
          <div class="card fade-in-up d3">
            <div class="card-header">
              <div class="card-title">Lo que he entendido de ti</div>
            </div>
            <div class="memory-grid">
              <div class="memory-list">
                ${items.map(i=>`<div class="memory-item"><span class="memory-check">✓</span> ${cleanText(i)}</div>`).join('')}
              </div>
              <div class="memory-ai-card">
                <span class="memory-ai-icon">🧠</span>
                <p class="memory-ai-text">Cuanto más hablamos, mejor puedo <em>acompañarte.</em></p>
              </div>
            </div>
          </div>`;
      }

      document.getElementById('feed').innerHTML = `
        <div class="card fade-in-up">
          <div class="card-header"><div class="card-title">Continuar conversación</div></div>
          <div class="conv-preview">
            <span class="conv-preview-icon">✦</span>
            <p class="conv-preview-text">Retomemos desde donde lo dejaste.</p>
            <div class="conv-preview-msg">${lastMsg}</div>
            <p class="conv-preview-time">${lastTime}</p>
          </div>
          <button class="conv-btn" onclick="retornarConversacion()"><span>Retomar conversación</span><span>→</span></button>
        </div>

        ${histHTML}
        ${suggestions}
        ${memoryHTML}

        <div class="card fade-in-up d4">
          <div class="card-header"><div class="card-title">Disponible en Pro</div></div>
          <div style="display:flex;flex-direction:column;gap:.6rem">
            <div class="locked-module"><span class="locked-icon">🧠</span><span class="locked-text">Memoria profunda — patrones, miedos, objetivos</span><span class="locked-badge">Pro</span></div>
            <div class="locked-module"><span class="locked-icon">◎</span><span class="locked-text">Roadmap personal de reinvención</span><span class="locked-badge">Pro</span></div>
            <div class="locked-module"><span class="locked-icon">↗</span><span class="locked-text">Seguimiento semanal continuo</span><span class="locked-badge">Pro</span></div>
          </div>
        </div>`;
    }

    // ── SUGERENCIAS DINÁMICAS ──
    function buildSuggestions() {
      // Basadas en las últimas respuestas de RenaIA
      const base = [
        { icon:'💬', text:'Retomemos lo que hablamos en tu última sesión', tag:'Continuidad' },
        { icon:'◈', text:'Sigamos explorando tus opciones profesionales', tag:'Tu proceso' },
        { icon:'◎', text:'¿Quieres organizar tus próximos pasos?', tag:'Claridad' },
        { icon:'✦', text:'Exploremos lo que más te importa ahora mismo', tag:'Tu dirección' },
      ];

      // Si hay respuestas recientes de RenaIA, construir sugerencias contextuales
      let suggestions = [...base];
      if (userData.recentAI?.length) {
        const lastAI = cleanText(userData.recentAI[0]?.mensaje || '');
        if (lastAI.length > 20) {
          suggestions[0] = { icon:'💬', text:'Continúa desde donde lo dejamos', tag:'Basado en tu última sesión' };
        }
      }

      return `
        <div class="card fade-in-up d2">
          <div class="card-header">
            <div><div class="card-title">Sugerencias para ti</div><div class="card-sub">Basadas en tus conversaciones</div></div>
          </div>
          <div class="suggestions-grid">
            ${suggestions.map(s=>`
              <div class="suggestion" onclick="comenzarSugerencia('${s.text}')">
                <span class="suggestion-icon">${s.icon}</span>
                <p class="suggestion-text">${s.text}</p>
                <p class="suggestion-tag">${s.tag}</p>
              </div>`).join('')}
          </div>
        </div>`;
    }

    // ── PRO STATE ──
    function renderProState() {
      document.getElementById('topbar-title').innerHTML =
        `Hola, <em style="font-style:normal;color:var(--green)">${userName}</em>. 🌙`;
      document.getElementById('topbar-sub').textContent = 'He estado pensando en tu proceso. Continuemos.';
      document.getElementById('nav-road').classList.remove('locked');
      document.getElementById('nav-cal').classList.remove('locked');
      document.getElementById('sb-progress-wrap').style.display = 'block';
      const pct = Math.min(userData.convCount * 3, 95);
      document.getElementById('sb-pct').textContent = pct + '%';
      document.getElementById('sb-bar').style.width = pct + '%';
      document.getElementById('sb-progress-note').textContent = 'Vas muy bien. Sigue así.';

      const lastMsg = cleanText(userData.lastConv?.mensaje || '...');
      const lastTime = userData.lastConv ? formatDate(userData.lastConv.created_at) : '';

      let memoryHTML = '';
      if (userData.memory?.summary) {
        const items = userData.memory.summary.split('\n').filter(Boolean).slice(0,5);
        memoryHTML = `
          <div class="card fade-in-up d3">
            <div class="card-header"><div class="card-title">Lo que he entendido de ti</div></div>
            <div class="memory-grid">
              <div class="memory-list">
                ${items.map(i=>`<div class="memory-item"><span class="memory-check">✓</span> ${cleanText(i)}</div>`).join('')}
              </div>
              <div class="memory-ai-card">
                <span class="memory-ai-icon">🧠</span>
                <p class="memory-ai-text">Cuanto más hablamos, mejor puedo <em>acompañarte.</em></p>
              </div>
            </div>
          </div>`;
      }

      document.getElementById('feed').innerHTML = `
        <div class="card fade-in-up">
          <div class="card-header"><div class="card-title">Continuar conversación</div></div>
          <div class="conv-preview">
            <span class="conv-preview-icon">✦</span>
            <p class="conv-preview-text">Retomemos desde donde lo dejaste.</p>
            <div class="conv-preview-msg">${lastMsg}</div>
            <p class="conv-preview-time">${lastTime}</p>
          </div>
          <button class="conv-btn" onclick="retornarConversacion()"><span>Retomar conversación</span><span>→</span></button>
        </div>
        ${buildSuggestions()}
        ${memoryHTML}`;
    }

    // ── RIGHT PANEL ──
    function renderRightPanel() {
      const rp = document.getElementById('right-panel');

      if (userState === 'empty') {
        rp.innerHTML = `
          <div>
            <div class="rp-title">Tu espacio</div>
            <div style="display:flex;flex-direction:column;gap:.75rem">
              <div class="rp-placeholder"><span class="rp-placeholder-icon">↗</span><p class="rp-placeholder-text">Tu progreso aparecerá después de tu primera conversación</p></div>
              <div class="rp-placeholder"><span class="rp-placeholder-icon">◎</span><p class="rp-placeholder-text">Tu roadmap se construirá contigo</p></div>
              <div class="rp-placeholder"><span class="rp-placeholder-icon">📖</span><p class="rp-placeholder-text">Tus reflexiones quedarán guardadas aquí</p></div>
            </div>
          </div>`;
        return;
      }

      const pct = userState === 'pro' ? Math.min(userData.convCount * 3, 95) : Math.min(userData.convCount * 5, 40);
      const offset = 220 - (220 * pct / 100);

      // Reflexión reciente — limpia markdown
      const reflHTML = userData.recentAI?.length ? `
        <div>
          <div class="rp-title">Reflexión reciente</div>
          <div class="reflection-card">
            <p class="reflection-text">${cleanText(userData.recentAI[0]?.mensaje || '').slice(0,180)}...</p>
            <p class="reflection-time">${formatDate(userData.recentAI[0]?.created_at)}</p>
          </div>
        </div>` : '';

      // Upgrade banner solo para free
      const upgradeHTML = userState === 'free' ? `
        <div>
          <div class="rp-title">RenaIA Pro</div>
          <div class="upgrade-banner">
            <p class="upgrade-banner-title">Profundiza tu proceso</p>
            <p class="upgrade-banner-sub">Memoria profunda, roadmap personal y seguimiento semanal continuo.</p>
            <button class="upgrade-btn"><span>Activar RenaIA Pro</span><span>→</span></button>
          </div>
        </div>` : '';

      rp.innerHTML = `
        <div>
          <div class="rp-title">Tu progreso</div>
          <div class="donut-wrap">
            <div class="donut-chart">
              <svg width="88" height="88" viewBox="0 0 88 88">
                <circle class="donut-bg" cx="44" cy="44" r="34"/>
                <circle class="donut-fill" cx="44" cy="44" r="34" stroke="url(#dg)" stroke-dashoffset="${offset}"/>
                <defs><linearGradient id="dg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0f7a55"/><stop offset="100%" stop-color="#1a9e72"/></linearGradient></defs>
              </svg>
              <div class="donut-text"><span class="donut-pct">${pct}%</span><span class="donut-label">Progreso</span></div>
            </div>
            <div class="donut-legend">
              <div class="donut-leg-item"><div class="donut-leg-left"><div class="donut-leg-dot" style="background:#1a9e72"></div><span class="donut-leg-name">Claridad</span></div><span class="donut-leg-val">${Math.min(pct+10,100)}%</span></div>
              <div class="donut-leg-item"><div class="donut-leg-left"><div class="donut-leg-dot" style="background:#6390dc"></div><span class="donut-leg-name">Confianza</span></div><span class="donut-leg-val">${Math.max(pct-10,0)}%</span></div>
              <div class="donut-leg-item"><div class="donut-leg-left"><div class="donut-leg-dot" style="background:#b48c32"></div><span class="donut-leg-name">Dirección</span></div><span class="donut-leg-val">${pct}%</span></div>
            </div>
          </div>
        </div>
        ${reflHTML}
        ${upgradeHTML}`;
    }

    // ── FORMATO FECHA ──
    function formatDate(dateStr) {
      if (!dateStr) return '';
      try {
        return new Date(dateStr).toLocaleDateString('es-CL', { weekday:'short', hour:'2-digit', minute:'2-digit' });
      } catch { return ''; }
    }

    // ── NAVEGACIÓN ──
    function navClick(e, el) {
      e?.preventDefault();
      document.querySelectorAll('.sb-item').forEach(i => i.classList.remove('active'));
      el?.classList.add('active');
    }

    function showHome(e) {
      e?.preventDefault();
      document.getElementById('home-view').classList.remove('hidden');
      document.getElementById('chat-view').classList.remove('active');
      document.querySelectorAll('.sb-item').forEach(i => i.classList.remove('active'));
      document.getElementById('nav-inicio').classList.add('active');
      document.getElementById('topbar-title').innerHTML =
        `Hola, <em style="font-style:normal;color:var(--green)">${userName}</em>. 🌙`;
      document.getElementById('topbar-sub').textContent = 'Retoma donde lo dejaste. RenaIA recuerda lo que importa.';
    }

    function showChat(e) {
      e?.preventDefault();
      document.getElementById('home-view').classList.add('hidden');
      document.getElementById('chat-view').classList.add('active');
      document.querySelectorAll('.sb-item').forEach(i => i.classList.remove('active'));
      document.getElementById('nav-conv').classList.add('active');
      document.getElementById('topbar-title').textContent = 'Conversación';
      document.getElementById('topbar-sub').textContent   = 'RenaIA está aquí para acompañarte.';
      setTimeout(() => document.getElementById('chat-input').focus(), 100);
    }

    // Cargar historial real al retomar
    async function retornarConversacion() {
      showChat(null);
      const msgs = document.getElementById('chat-messages');
      msgs.innerHTML = '';

      // Mostrar loading
      msgs.innerHTML = `<div style="text-align:center;padding:2rem;color:var(--text-3);font-size:13px">Cargando conversación...</div>`;

      const { data: historial } = await sb
        .from('conversaciones')
        .select('rol, mensaje, created_at')
        .eq('usuario_id', currentUser.id)
        .order('created_at', { ascending:true })
        .limit(40);

      msgs.innerHTML = '';

      if (!historial?.length) {
        msgs.innerHTML = `<div style="text-align:center;padding:2rem;color:var(--text-3);font-size:13px">No hay mensajes aún.</div>`;
        return;
      }

      historial.forEach(m => {
        const tipo = m.rol === 'user' ? 'user' : 'ai';
        addMsg(cleanText(m.mensaje), tipo);
      });

      // Mensaje de continuidad de RenaIA
      setTimeout(() => {
        addMsg('Aquí estoy. ¿Continuamos desde donde lo dejamos?', 'ai');
      }, 400);
    }

    async function showConversaciones(e) {
      e?.preventDefault();
      showChat(null);
      await retornarConversacion();
    }

    function showReflexiones(e) {
      e?.preventDefault();
      document.querySelectorAll('.sb-item').forEach(i => i.classList.remove('active'));
      document.getElementById('nav-refl').classList.add('active');
      document.getElementById('home-view').classList.remove('hidden');
      document.getElementById('chat-view').classList.remove('active');
      document.getElementById('topbar-title').textContent = 'Reflexiones';
      document.getElementById('topbar-sub').textContent = 'Lo que RenaIA ha entendido de tu proceso.';

      if (!userData.recentAI?.length) {
        document.getElementById('feed').innerHTML = `
          <div class="empty-hero fade-in-up" style="padding:2rem">
            <span class="empty-star" style="font-size:24px">📖</span>
            <h2 class="empty-title" style="font-size:24px">Todavía no hay reflexiones.</h2>
            <p class="empty-sub">A medida que conversemos, RenaIA guardará aquí los momentos más importantes de tu proceso.</p>
            <a href="#" class="empty-cta" onclick="comenzarConversacion(event)" style="padding:12px 24px;font-size:13px"><span>✦</span> Comenzar conversación <span>→</span></a>
          </div>`;
        return;
      }

      const reflsHTML = userData.recentAI.map(m => `
        <div class="card fade-in-up">
          <div class="reflection-card" style="border:none;padding:0;background:transparent">
            <p class="reflection-text">${cleanText(m.mensaje).slice(0, 300)}${m.mensaje.length > 300 ? '...' : ''}</p>
            <p class="reflection-time">${formatDate(m.created_at)}</p>
          </div>
        </div>`).join('');

      document.getElementById('feed').innerHTML = reflsHTML;
    }

    function nuevaConversacion() {
      showChat(null);
      document.getElementById('chat-messages').innerHTML = '';
    }

    function comenzarConversacion(e) { e?.preventDefault(); showChat(null); }
    function comenzarSugerencia(texto) { showChat(null); setTimeout(() => sendMessage(texto), 300); }

    // ── CHAT ──
    function addMsg(text, type) {
      const el = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerHTML = `<div class="msg-avatar ${type}">${type==='ai'?'✦':'Tú'}</div><div class="bubble">${text}</div>`;
      el.appendChild(div); el.scrollTop = el.scrollHeight;
    }

    function showTyping() {
      const el = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.id = 'typing'; div.className = 'typing-wrap';
      div.innerHTML = `<div class="msg-avatar ai">✦</div><div class="typing"><span></span><span></span><span></span></div>`;
      el.appendChild(div); el.scrollTop = el.scrollHeight;
    }

    function hideTyping() { document.getElementById('typing')?.remove(); }
    function updateAgent(agente) { document.getElementById('agent-name').textContent = agentLabels[agente] || agentLabels.core; }

    async function sendMessage(msg) {
      addMsg(msg, 'user');
      showTyping();
      try {
        const res = await fetch('/chat', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ mensaje:msg, sesionId:currentUser.id })
        });
        const data = await res.json();
        hideTyping();
        addMsg(data.respuesta, 'ai');
        if (data.agente) updateAgent(data.agente);

        await sb.from('conversaciones').insert([
          { usuario_id:currentUser.id, rol:'user',      mensaje:msg,           agente:'core',              created_at:new Date().toISOString() },
          { usuario_id:currentUser.id, rol:'assistant', mensaje:data.respuesta, agente:data.agente||'core', created_at:new Date().toISOString() }
        ]);

        // Actualizar estado y datos en background
        userData.convCount++;
        userData.hasConversations = true;
        if (userState === 'empty') {
          userState = 'free';
          await checkUserState();
          renderDashboard();
        } else {
          // Actualizar último mensaje sin re-render completo
          userData.lastConv = { mensaje: msg, created_at: new Date().toISOString() };
          if (!userData.recentAI) userData.recentAI = [];
          userData.recentAI.unshift({ mensaje: data.respuesta, created_at: new Date().toISOString() });
        }
      } catch {
        hideTyping();
        addMsg('Hubo un error. Intenta de nuevo.', 'ai');
      }
    }

    function enviarDesdeHome() {
      const input = document.getElementById('home-input');
      const msg = input.value.trim();
      if (!msg) return;
      input.value = '';
      showChat(null);
      sendMessage(msg);
    }

    function enviarChat() {
      const input = document.getElementById('chat-input');
      const msg = input.value.trim();
      if (!msg) return;
      input.value = '';
      sendMessage(msg);
    }

    document.getElementById('home-input').addEventListener('keypress', e => { if(e.key==='Enter') enviarDesdeHome(); });
    document.getElementById('chat-input').addEventListener('keypress', e => { if(e.key==='Enter') enviarChat(); });

    async function signOut() { await sb.auth.signOut(); window.location.href = '/'; }

    init();
  </script>
</body>
</html>
