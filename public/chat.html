<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RenaIA</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;1,500&display=swap');
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'DM Sans',sans-serif;background:#050607;color:#f0f0f0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
    .header{padding:1rem 1.5rem;border-bottom:0.5px solid rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:space-between;background:rgba(5,6,7,0.95);backdrop-filter:blur(10px);flex-shrink:0}
    .logo{display:flex;align-items:center;gap:8px;text-decoration:none}
    .logo-text{font-size:17px;font-weight:500;color:#f0f0f0;letter-spacing:-0.3px}
    .logo-text em{color:#1D9E75;font-style:normal;font-weight:600}
    .header-right{display:flex;align-items:center;gap:1rem}
    .status{display:flex;align-items:center;gap:6px;font-size:12px;color:#1D9E75}
    .status::before{content:'';width:6px;height:6px;border-radius:50%;background:#1D9E75;display:inline-block;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
    .agent-badge{font-size:11px;padding:3px 10px;border:0.5px solid rgba(29,158,117,0.3);border-radius:100px;background:rgba(29,158,117,0.06);color:#9FE1CB;transition:all 0.4s ease}
    .agent-badge.path{color:#93c5fd;border-color:rgba(147,197,253,0.3);background:rgba(147,197,253,0.06)}
    .agent-badge.career{color:#fcd34d;border-color:rgba(252,211,77,0.3);background:rgba(252,211,77,0.06)}
    .chat{flex:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:1.25rem;max-width:720px;width:100%;margin:0 auto}
    .chat::-webkit-scrollbar{width:0}
    .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;position:relative;min-height:60vh}
    .welcome-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:500px;height:300px;background:radial-gradient(ellipse,rgba(29,158,117,0.07) 0%,transparent 60%);pointer-events:none}
    .welcome-star{font-size:28px;color:#1D9E75;margin-bottom:1.5rem;display:block;animation:starfloat 3s ease-in-out infinite;text-shadow:0 0 20px rgba(29,158,117,0.4)}
    @keyframes starfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .welcome h1{font-family:'Playfair Display',serif;font-size:42px;font-weight:500;line-height:1.1;margin-bottom:1rem;color:#f1f5f9}
    .welcome h1 em{font-style:italic;color:#1D9E75}
    .welcome p{font-size:15px;color:#4a5568;font-weight:300;line-height:1.7;max-width:400px;margin:0 auto 2.5rem}
    .welcome-input-wrap{position:relative;width:100%;max-width:560px;margin:0 auto}
    .welcome-input-inner{display:flex;align-items:center;gap:10px;background:#0a0f14;border-radius:100px;padding:12px 14px 12px 20px;border:0.5px solid rgba(29,158,117,0.25)}
    .welcome-input-inner input{flex:1;background:transparent;border:none;outline:none;color:#f0f0f0;font-size:15px;font-family:'DM Sans',sans-serif;font-weight:300}
    .welcome-input-inner input::placeholder{color:#2d3748}
    .send-btn{width:40px;height:40px;border-radius:50%;background:#1D9E75;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform 0.2s}
    .send-btn:hover{transform:scale(1.05)}
    .send-btn svg{width:16px;height:16px;fill:white}
    .welcome-note{margin-top:0.75rem;font-size:11px;color:#1e2d26;text-align:center}
    .msg{display:flex;gap:10px;align-items:flex-start;animation:fadeIn 0.4s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .msg.user{flex-direction:row-reverse}
    .avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0}
    .avatar.ai{background:linear-gradient(135deg,#0a4a38,#1D9E75);color:white;font-size:12px}
    .avatar.user{background:#0f1623;color:#374151;border:0.5px solid #1a2235;font-size:10px}
    .bubble{max-width:82%;padding:12px 16px;border-radius:16px;font-size:15px;line-height:1.7;font-weight:300}
    .msg.ai .bubble{background:#0a1a14;border:0.5px solid rgba(29,158,117,0.12);border-bottom-left-radius:4px;color:#e0e0e0}
    .msg.user .bubble{background:#1D9E75;color:white;border-bottom-right-radius:4px}
    .typing-wrap{display:flex;gap:10px;align-items:flex-start}
    .typing{display:flex;gap:4px;padding:12px 16px;background:#0a1a14;border:0.5px solid rgba(29,158,117,0.12);border-radius:16px;border-bottom-left-radius:4px}
    .typing span{width:5px;height:5px;border-radius:50%;background:#1D9E75;animation:bounce 1.2s infinite}
    .typing span:nth-child(2){animation-delay:0.2s}
    .typing span:nth-child(3){animation-delay:0.4s}
    @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
    .input-area{padding:1rem 1.5rem;border-top:0.5px solid rgba(255,255,255,0.04);max-width:720px;width:100%;margin:0 auto;display:none;gap:10px;flex-shrink:0}
    .input-area input{flex:1;background:#0a0f14;border:0.5px solid rgba(255,255,255,0.07);border-radius:100px;padding:12px 20px;color:#f0f0f0;font-size:15px;font-family:'DM Sans',sans-serif;font-weight:300;outline:none;transition:border-color 0.2s}
    .input-area input:focus{border-color:rgba(29,158,117,0.4)}
    .input-area input::placeholder{color:#1e2d26}
  </style>
</head>
<body>
  <div class="header">
    <a class="logo" href="index.html">
      <svg width="26" height="26" viewBox="0 0 30 30" fill="none">
        <path d="M7 5 L7 25" stroke="#1D9E75" stroke-width="3" stroke-linecap="round"/>
        <path d="M7 5 L18 5 C22 5 24 7.5 24 11 C24 14.5 22 17 18 17 L7 17" stroke="#1D9E75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 17 L24 25" stroke="#1D9E75" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">Rena<em>IA</em></span>
    </a>
    <div class="header-right">
      <div class="agent-badge" id="agentBadge">✦ Rena Core</div>
      <div class="status">en línea</div>
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="welcome" id="welcome">
      <div class="welcome-glow"></div>
      <span class="welcome-star">✦</span>
      <h1>Hay un camino.<br><em>Siempre lo hay.</em></h1>
      <p>Cuéntame qué está pasando. Estoy aquí para escucharte y acompañarte a encontrar tu próximo paso.</p>
      <div class="welcome-input-wrap">
        <div class="welcome-input-inner">
          <input type="text" id="welcomeInput" placeholder="Cuéntame qué está pasando..." />
          <button class="send-btn" onclick="enviarDesdeWelcome()">
            <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
      <div class="welcome-note">✦ RenaIA te responde en segundos</div>
    </div>
  </div>

  <div class="input-area" id="inputArea">
    <input type="text" id="input" placeholder="Escribe aquí..." />
    <button class="send-btn" onclick="enviar()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>

  <script>
    const sesionId = localStorage.getItem('renaiaSession') || crypto.randomUUID();
    localStorage.setItem('renaiaSession', sesionId);

    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const welcomeInputEl = document.getElementById('welcomeInput');
    const inputAreaEl = document.getElementById('inputArea');
    const welcomeEl = document.getElementById('welcome');
    const agentBadgeEl = document.getElementById('agentBadge');

    let iniciado = false;

    const agentLabels = {
      core: '✦ Rena Core',
      path: '◎ Rena Path',
      career: '↗ Rena Career'
    };

    welcomeInputEl.addEventListener('keypress', e => { if (e.key === 'Enter') enviarDesdeWelcome(); });
    inputEl.addEventListener('keypress', e => { if (e.key === 'Enter') enviar(); });

    function iniciarChat() {
      if (iniciado) return;
      iniciado = true;
      welcomeEl.style.display = 'none';
      inputAreaEl.style.display = 'flex';
    }

    function enviarDesdeWelcome() {
      const msg = welcomeInputEl.value.trim();
      if (!msg) return;
      iniciarChat();
      enviarMensaje(msg);
    }

    function enviar() {
      const msg = inputEl.value.trim();
      if (!msg) return;
      inputEl.value = '';
      enviarMensaje(msg);
    }

    function agregarMensaje(texto, tipo) {
      const div = document.createElement('div');
      div.className = `msg ${tipo}`;
      div.innerHTML = `
        <div class="avatar ${tipo}">${tipo === 'ai' ? '✦' : 'Tú'}</div>
        <div class="bubble">${texto}</div>
      `;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function mostrarTyping() {
      const div = document.createElement('div');
      div.id = 'typing';
      div.className = 'typing-wrap';
      div.innerHTML = `
        <div class="avatar ai">✦</div>
        <div class="typing"><span></span><span></span><span></span></div>
      `;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function quitarTyping() {
      const t = document.getElementById('typing');
      if (t) t.remove();
    }

    function actualizarAgente(agente) {
      agentBadgeEl.textContent = agentLabels[agente] || agentLabels.core;
      agentBadgeEl.className = `agent-badge ${agente}`;
    }

    async function enviarMensaje(mensaje) {
      agregarMensaje(mensaje, 'user');
      mostrarTyping();
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensaje, sesionId })
        });
        const data = await res.json();
        quitarTyping();
        agregarMensaje(data.respuesta, 'ai');
        if (data.agente) actualizarAgente(data.agente);
      } catch {
        quitarTyping();
        agregarMensaje('Hubo un error. Intenta de nuevo.', 'ai');
      }
    }
  </script>
</body>
</html>
